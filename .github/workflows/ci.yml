name: Foundation checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, mysql]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: toyota_showroom_test
          MYSQL_ROOT_PASSWORD: testing-only-ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptesting-only-ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, pdo_sqlite, zip
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php scripts/architecture-inventory.php --check
      - run: php scripts/check-project.php
      - run: vendor/bin/pint --test
      - name: SQLite tests
        if: matrix.database == 'sqlite'
        run: php artisan test
      - name: MySQL tests
        if: matrix.database == 'mysql'
        run: php artisan test
        env:
          DB_CONNECTION: mysql
          DB_DATABASE: toyota_showroom_test
          DB_USERNAME: root
          DB_PASSWORD: testing-only-ci
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
